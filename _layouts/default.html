<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
    <link rel="icon"
          type="image/ico"
          href="{{ site.baseurl }}/favicon.ico">
    
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead">
          <a href="{{ site.baseurl }}/" class="site-avatar" aria-label="Stanford RAIN Seminar home"><img src="{{ site.avatar }}" alt="" /></a>

          <div class="site-info">
            <div class="site-name"><a href="{{ site.baseurl }}/">{{ site.title }}</a></div>
          </div>

          <nav aria-label="Primary navigation">
            <a href="{{ site.baseurl }}/#upcoming-talks"{% if page.url == "/" %} aria-current="page"{% endif %}>Upcoming</a>
            <a href="{{ site.baseurl }}/#calendar">Calendar</a>
            <a href="{{ site.baseurl }}/archive/"{% if page.url == "/archive/" %} aria-current="page"{% endif %}>Archive</a>
            <a href="{{ site.mailing_list_url }}">Mailing list</a>
          </nav>
        </header>
      </div>
    </div>

    <main id="main" class="container">
      {{ content }}
    </main>
    

    <!--
    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>
    -->

    {% include analytics.html %}
  </body>
</html>
