    - talk_id: "RAIN-2026-11-10-SHAH"
      speaker: "Devavrat Shah"
      date: "Nov 10, 2026"
      affiliation: "MIT"
      time: "4:30–5:30 PM PT"
      location: "Y2E2 101"
      title: "Some Results on Time Series"
      abstract: |
        In this talk, I will describe a research program on time series that I have been pursuing with various collaborators over the past decade. I will start by recalling the literature on time series. I will discuss a representation for time series data through the lens of low-rank matrices and its implications for robust, scalable forecasting, imputation methods. Finally, I will touch upon ongoing project with the goal of developing efficient time series foundation model with synthetic data inspired by the traditional statistical models.
      bio: |
        Devavrat Shah is an Andrew (1956) and Erna Viterbi Professor of Electrical Engineering and Computer Science at MIT. He is chief scientist at Celonis, Inc. He co-founded Celect in 2014 (part of Nike since 2019) and Ikigai Labs in 2019 (part of Celonis since 2026). At MIT, he was the faculty director of Deshpande Center for Tech Innovation between 2020 to 2023, founding director of the Statistics and Data Science Center at MIT between 2016 to 2020. He is a distinguished alumnus of his alma mater IIT Bombay. His work has been recognized through career prizes 2008 ACM Sigmetrics Rising Star, 2010 INFORMS Erlang Prize, 2024 INFORMS Applied Probability Society Markov Lecture, 2025 ACM Sigmetrics Achievement Award; paper prizes at IEEE Infocom, ACM Sigmetrics, NeurIPS, INFORMS Applied Probability Society, INFORM Management Science and Operations Management; INFORMS George B Dantzig thesis prize and test of time awards at ACM Sigmetrics. He is Kavli Fellow of National Academy of Sciences. He was an adjunct professor at Tata Institute of Fundamental Research, Mumbai and currently a distinguished professor of Data Science and AI at Indian Institute of Technology, Guwahati.
