    - talk_id: "RAIN-2026-12-01-MURPHY"
      speaker: "Susan Murphy"
      date: "Dec 1, 2026"
      affiliation: "Harvard University"
      time: "4:30–5:30 PM PT"
      location: "Y2E2 299"
      title: "Inferential Replicability for Online Decision-Making Algorithms"
      abstract: "Reinforcement learning (RL) algorithms are increasingly used as an intervention component in digital health interventions. Including the RL algorithm in an intervention can complicate data analyses on the resulting longitudinal data. Longitudinal data analyses, and causal inference, more broadly are critical for deciding how to refine the intervention, and deciding whether to further deploy the intervention. This talk discusses the replicability of statistical analyses in these settings. We demonstrate that many standard statistical estimators can be inconsistent and fail to be replicable across repetitions of the deployment, even as the sample size grows large. We show that this non-replicability is intimately related to properties of the RL algorithm itself. We introduce a formal definition of a \"replicable RL algorithm\" and prove that under such algorithms, a wide variety of common statistical analyses are guaranteed to be consistent. This work is motivated by our involvement in a mobile health oral health self-care intervention and a mobile intervention designed to help people reduce cannabis use."
      bio: "Susan A. Murphy is Mallinckrodt Professor of Statistics and of Computer Science and Associate Faculty at the Kempner Institute, Harvard University. Her research focuses on improving sequential decision making via the development of online, real-time reinforcement learning algorithms. Her lab is involved in multiple deployments of these algorithms in digital health. She is a member of the US National Academy of Sciences and of the US National Academy of Medicine. In 2013 she was awarded a MacArthur Fellowship for her work on experimental designs to inform sequential decision making. She is a Fellow of the College on Problems in Drug Dependence, Past-President of Institute of Mathematical Statistics, Past-President of the Bernoulli Society and a former editor of the Annals of Statistics."
