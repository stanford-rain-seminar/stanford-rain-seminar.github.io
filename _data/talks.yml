    - talk_id: "RAIN-2026-10-27-BASTANI"
      speaker: "Hamsa Sridhar Bastani"
      date: "Oct 27, 2026"
      affiliation: "University of Pennsylvania"
      time: "4:30–5:30 PM PT"
      location: "Y2E2 299"
      title: "From Conversations to Interventions: Learning to Target AI Assistance"
      abstract: |
        Generative AI chatbots are increasingly deployed in high-stakes settings, raising concerns about cognitive offloading and loss of human agency. Simultaneously, the rich conversation data that arises from these interactions provides us an unprecedented window into human thinking. We propose to enable effective human-AI collaboration by learning policies that target AI assistance based on conversation data. We illustrate this approach in the context of education, where we use student-platform interactions to personalize practice problems and sustain "productive struggle." In a five-month randomized field experiment across ten Taipei high schools, our approach improved unassisted final exam performance by 0.15 standard deviations without increasing teacher workload.

        However, learning policies from historical data introduces a fundamental challenge: optimizing for the largest predicted gains often exploits prediction errors, leading to illusory improvements called the "winner’s curse". We propose inference-aware policy optimization, a novel method that learns policies accounting for downstream evaluation, allowing us to characterize the Pareto frontier between expected improvement and statistical significance. I will conclude by discussing the broader potential of policy learning to harness the rich signals in human-AI conversations to promote human flourishing.
