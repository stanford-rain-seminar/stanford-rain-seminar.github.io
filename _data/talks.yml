    - talk_id: "RAIN-2026-10-20-TAN"
      speaker: "Xizhi Tan"
      date: "Oct 20, 2026"
      affiliation: "Stanford University"
      time: "4:30–5:30 PM PT"
      location: "Y2E2 101"
      title: "Mechanism Design with AI and for AI: Reliable Use and Sustainable Production of Information"
      abstract: |
        Artificial intelligence is transforming how information is used and produced. However, blind reliance on fallible AI predictions creates significant risks, while generative models disrupt the economic markets that sustain original content creation. In this talk, I address these dual challenges through the lens of mechanism design.
        First, in mechanism design with AI, I will introduce learning-augmented mechanisms that leverage potentially unreliable predictions to improve outcomes in strategic environments. Focusing on online auctions, I will demonstrate how we can design truthful mechanisms that achieve the optimal tradeoff between consistency (performance with accurate predictions) and robustness (worst-case guarantees).
        Second, I will discuss mechanism design for AI. To sustain the content economy that AI relies on, an ideal platform should fund creator compensation directly from the revenue generated by its selected content. In such "self-funded marketplaces," I will show how sequential auctions allow highly profitable selections to subsidize valuable, specialized information, guaranteeing a constant-factor approximation to a novel benchmark designed for this setting.
      bio: |
        Xizhi Tan is a Motwani/HAI Postdoctoral Fellow at Stanford University, hosted by Aviad Rubinstein, Amin Saberi, and Ellen Vitercik. She received her PhD in Computer Science from Drexel University, where she was advised by Vasilis Gkatzelis. Her research lies at the intersection of economics and computer science, with a focus on algorithmic game theory, mechanism design, and the role of potentially unreliable information in improving market efficiency. More recently, she has been studying economic questions arising from generative AI, including data markets and the content ecosystem. Her work has received an ACM SIGecom Doctoral Dissertation Award Honorable Mention and an EC Exemplary Theory Track Paper Award.
